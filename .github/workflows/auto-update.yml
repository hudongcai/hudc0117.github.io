name: Auto Update AI News

on:
  schedule:
    # 每天早上8点（北京时间）= UTC时间0点
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Run update script
      run: node scripts/auto-update-ai-news.js

    - name: Commit and push if changed
      run: |
        git config --global user.email "hudongcai@intellake.com"
        git config --global user.name "Auto Update Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Daily AI news $(date +'%Y-%m-%d')" && git push)
